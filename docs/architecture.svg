<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-labelledby="title description"><title id="title">delegate? architecture</title><desc id="description">Local dashboard and CLI use a bounded read-only scanner. Public RPC supplies token account and mint data. Offline examples use the same decoder. Reports can be exported to JSON or Markdown.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#819c9b"/></marker></defs><rect width="1040" height="460" rx="12" fill="#10171d"/><g fill="none" stroke="#4c726a" stroke-width="2" marker-end="url(#arrow)"><path d="M235 150H389"/><path d="M235 285H310V194H389"/><path d="M650 160H800"/><path d="M800 205H650"/><path d="M520 238V324"/><path d="M520 324V238" stroke-dasharray="5 6" marker-end="none"/></g><g font-family="ui-sans-serif,system-ui,sans-serif"><text x="40" y="43" fill="#9de6cc" font-size="12" letter-spacing="2">DELEGATE? / READ-ONLY DATA FLOW</text><g fill="#19232c" stroke="#40505c"><rect x="40" y="105" width="195" height="90" rx="9"/><rect x="40" y="245" width="195" height="85" rx="9"/><rect x="390" y="105" width="260" height="133" rx="9"/><rect x="800" y="105" width="200" height="133" rx="9"/><rect x="390" y="325" width="260" height="85" rx="9"/></g><g fill="#edf2f7" font-size="16"><text x="62" y="140">Dashboard + CLI</text><text x="62" y="278">Offline examples</text><text x="412" y="140">Permission scanner</text><text x="822" y="140">Public Solana RPC</text><text x="412" y="360">JSON + Markdown</text></g><g fill="#b2bfca" font-size="12"><text x="62" y="166">127.0.0.1 · public address</text><text x="62" y="303">Fictional binary snapshots</text><text x="412" y="168">Decode accounts and mints</text><text x="412" y="190">Interpret scoped authorities</text><text x="412" y="212">Mark missing and unknown data</text><text x="822" y="168">SPL Token + Token-2022</text><text x="822" y="191">Confirmed reads + slots</text><text x="822" y="214">No transaction submission</text><text x="412" y="385">Explicit exports · no saved history</text><text x="271" y="135">inspect</text><text x="683" y="146">read only</text><text x="684" y="225">snapshots</text><text x="548" y="288">report</text></g><text x="40" y="432" fill="#9de6cc" font-size="11">NO WALLET CONNECTION · NO SIGNING · NO DATABASE · NO CLOUD BACKEND</text></g></svg>
